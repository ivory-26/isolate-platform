name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Biome check
        run: bun run check
      - name: Typecheck all workspaces
        run: bun run typecheck
      - name: Web production build
        working-directory: apps/web
        run: bun run build
      - name: Web client secret sweep
        working-directory: apps/web
        run: bun run check:client
      - name: Tests (live-DB integration auto-skips without DATABASE_URL)
        run: bun run test

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until .env.example patterns are verified clean
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
